name: Testing

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }}, WP ${{ matrix.wp-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        wp-version: ['latest']
        include:
          - php-version: '8.4'
            wp-version: 'trunk'
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1:3306 ${{ matrix.wp-version }}

      - name: Run tests
        run: composer test

  lint:
    name: Lint & analyse
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      # Warnings are reported but do not fail the build; only errors do.
      - name: PHPCS
        run: composer lint -- --runtime-set ignore_warnings_on_exit 1

      - name: PHPStan
        run: composer analyse
